name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: sproates/panackelty
          ref: 261e0cef080e3ba2e5afcb24eb4467491a106f7f
          path: core
          persist-credentials: false
      - name: Materialize pinned core browser-runtime bundle
        run: make -C core browser-runtime-bundle && mv core/build/browser-runtime core-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install WASI SDK
        run: |
          sh core/scripts/install_wasi_sdk.sh "$RUNNER_TEMP/playground-sdk"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/playground-sdk/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Package the validated browser artifact
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: browser-release
          path: build/release/
          if-no-files-found: error

  publish:
    needs: browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: browser-release
          path: build/release
      - name: Publish an immutable browser version
        uses: actions/github-script@v8
        with:
          script: |
            const publish = require('./publish-release.cjs');
            const {version} = require('./package.json');
            await publish(github, context, 'build/release', version);
