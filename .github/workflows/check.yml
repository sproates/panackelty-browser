name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: sproates/panackelty
          ref: 261e0cef080e3ba2e5afcb24eb4467491a106f7f
          path: core
          persist-credentials: false
      - name: Materialize pinned core browser-runtime bundle
        run: make -C core browser-runtime-bundle && mv core/build/browser-runtime core-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install WASI SDK
        run: |
          sh core/scripts/install_wasi_sdk.sh "$RUNNER_TEMP/playground-sdk"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/playground-sdk/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm test
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Package visual review site
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p build/preview
          cp -R build/playground/. build/preview/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./">' > /dev/null
      - name: Upload visual review site
        if: github.event_name == 'pull_request'
        id: preview
        uses: actions/upload-artifact@v6
        with:
          name: visual-preview-pr-${{ github.event.pull_request.number }}
          path: build/preview
          if-no-files-found: error
          retention-days: 14
