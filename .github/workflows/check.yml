name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: sproates/panackelty
          ref: eb2e5f91c07bb0f2c91fa49ee82a8d770147fb9d
          path: core
          persist-credentials: false
      - name: Fetch verified alpha.15 browser-runtime bundle
        run: |
          curl --fail --location --retry 3 https://github.com/sproates/panackelty/releases/download/v0.1.0-alpha.15/panackelty-browser-runtime-0.1.0-alpha.15.tar.gz -o "$RUNNER_TEMP/browser-runtime.tar.gz"
          echo "fe7fd9cdddd378ff4c173cd3c075a912633cce3031d035cda1122274780bb2e3  $RUNNER_TEMP/browser-runtime.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/browser-runtime.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/browser-runtime" core-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore pinned WASI SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/playground-sdk/wasi.tar.gz
          key: wasi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('install_wasi_sdk.sh') }}
      - name: Install WASI SDK
        run: |
          sh install_wasi_sdk.sh "$RUNNER_TEMP/playground-sdk"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/playground-sdk/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build twice and verify deterministic output
        run: |
          npm run build
          cp build/playground/asset-version.txt "$RUNNER_TEMP/first-version.txt"
          cp build/playground/assets/*/vm.wasm "$RUNNER_TEMP/first.wasm"
          npm run build
          cmp "$RUNNER_TEMP/first-version.txt" build/playground/asset-version.txt
          cmp "$RUNNER_TEMP/first.wasm" build/playground/assets/*/vm.wasm
      - name: Install native test dependencies
        run: |
          # The Azure mirror stalled while downloading Playwright dependencies.
          # Use Ubuntu's main mirror; normal signed-package verification remains on.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev libssl-dev zlib1g-dev
      - name: Build native oracle and run all contracts
        run: make -C core native && npm test
      - name: Restore matching browser engines
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results
      - name: Package the validated browser artifact
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: browser-release
          path: build/release/
          if-no-files-found: error

  publish:
    needs: browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: browser-release
          path: build/release
      - name: Publish an immutable browser version
        uses: actions/github-script@v8
        with:
          script: |
            const publish = require('./publish-release.cjs');
            const {version} = require('./package.json');
            await publish(github, context, 'build/release', version);
