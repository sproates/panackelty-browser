name: Publish playground artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: sproates/panackelty
          ref: 261e0cef080e3ba2e5afcb24eb4467491a106f7f
          path: core
          persist-credentials: false
      - name: Materialize pinned core browser-runtime bundle
        run: make -C core browser-runtime-bundle && mv core/build/browser-runtime core-runtime
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install WASI SDK
        run: |
          sh core/scripts/install_wasi_sdk.sh "$RUNNER_TEMP/playground-sdk"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/playground-sdk/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Record immutable provenance
        run: |
          printf 'browser_commit=%s\ncore_commit=%s\n' "$GITHUB_SHA" 261e0cef080e3ba2e5afcb24eb4467491a106f7f > build/playground/DEPENDENCY
      - uses: actions/upload-artifact@v6
        with:
          name: panackelty-playground
          path: build/playground
          if-no-files-found: error
          retention-days: 90
